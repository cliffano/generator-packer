---
name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
      with:
        set-safe-directory: $\{{ github.workspace }}
    - uses: cliffano/command-docker-action@v2.1.0
      with:
        command: 'make ci'
        image: cliffano/studio:4.0.0
