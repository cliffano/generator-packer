---
name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: $\{{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: $\{{ github.workspace }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: 'make ci ARCH=$\{{ matrix.arch }}'
          image: cliffano/studio:4.0.0
